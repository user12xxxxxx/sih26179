[project]
name = "drishti"
version = "0.1.0"
description = "Modular edge-vision engine behind DukaanDrishti (SIH 2026, PS SIH26179)"
readme = "README.md"
requires-python = ">=3.10"
# The core, the simulator, reports and the dashboard need only these two.
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8", "onnxruntime>=1.17"]   # cameras, clips, detector (CPU)
gpu = ["onnxruntime-gpu>=1.17"]                                 # Lenovo RTX 4050 replays
track = ["supervision>=0.20"]                                   # ByteTrack
ocr = ["rapidocr-onnxruntime"]                                  # or: pytesseract + the tesseract binary
mqtt = ["paho-mqtt>=2.0"]
aihub = ["qai-hub"]
train = ["ultralytics"]                                         # training/export only, not on the box
dev = ["pytest>=8"]

[project.scripts]
drishti = "drishti.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drishti*"]

[tool.setuptools.package-data]
drishti = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
